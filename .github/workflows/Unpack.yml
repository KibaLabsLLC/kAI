name: Unpack archive

# Push a .tar.gz / .tgz to the repo and this unpacks it in place, deletes the
# archive, and commits the result. Pushes made with GITHUB_TOKEN don't re-trigger
# workflows, and the cleanup commit finds nothing left to unpack anyway.
on:
  push:
    paths:
      - "**.tar.gz"
      - "**.tgz"
      - "**_tar.gz"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-archive-${{ github.ref }}
  cancel-in-progress: false

env:
  # 0 keeps the archive's top folder (kibavoice/...). Set to 1 to drop it and
  # unpack straight into the folder the archive was pushed to.
  STRIP_COMPONENTS: 1

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and delete archives
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find . \
            \( -path ./.git -o -path ./.github \) -prune -o \
            -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*_tar.gz' \) -print0)

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No archives found, nothing to do."
            exit 0
          fi

          for f in "${archives[@]}"; do
            echo "::group::$f"
            # refuse absolute paths and ../ escapes
            if tar -tzf "$f" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "::error file=$f::unsafe path in archive, refusing to unpack"
              exit 1
            fi
            dir="$(dirname "$f")"
            tar -xzf "$f" -C "$dir" --strip-components="$STRIP_COMPONENTS" --no-same-owner
            git rm -q -f -- "$f"
            echo "::endgroup::"
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Unpack archive and remove it [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
